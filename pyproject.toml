[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "campus-gpu-fabric"
version = "0.2.0"
description = "Campus Fabric: contract-driven shared compute control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "jsonschema>=4.23,<5", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/campus_fabric"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

