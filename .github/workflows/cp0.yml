name: CP3 reliability and integrated regression
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: cp0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cp0:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv python install 3.12
      - run: make setup
      - run: make cp3-a
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp3-reliability-evidence
          path: |
            evidence/cp0/*.json
            evidence/cp1/a_core_receipt.json
            evidence/cp1/a_core_http_history.json
            evidence/cp1/joint_backend_receipt.json
            evidence/cp1/joint_backend_history.json
            evidence/cp2/
            evidence/cp3/
          if-no-files-found: ignore
