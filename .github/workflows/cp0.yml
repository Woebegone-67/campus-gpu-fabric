name: CP0 contract and scaffold gate
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: cp0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cp0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv python install 3.12
      - run: make setup
      - run: make cp0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp0-evidence
          path: evidence/cp0/*.json
          if-no-files-found: ignore
